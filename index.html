    <script>
      // Legacy PWA migration: the previous handstand-tracker PWA precached its
      // shell in Cache Storage ("hs-tracker-*"). Purge those buckets and drop
      // any still-registered worker so every visitor gets this app, not the
      // cached old UI. Runs once per load; harmless for fresh visitors.
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) { r.unregister().catch(function () {}); });
            }).catch(function () {});
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (ks) {
              ks.forEach(function (k) {
                if (k.indexOf('hs-tracker-') === 0) caches.delete(k).catch(function () {});
              });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
