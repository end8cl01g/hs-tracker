# Deploy the Skyrim Quest & Perks Tracker (Vite SPA) to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do NOT cancel in-progress runs so
# production deployments always complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # bun.lock is the source of truth for this repo (npm ci would fail);
      # bun install --frozen-lockfile is deterministic and much faster.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          echo "dist ok：$(find dist -type f | wc -l) files / $(du -sb dist | cut -f1) bytes"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Automatically create/enable the Pages site if it does not exist yet
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
