[package]
name = "skyrim_engine"
version = "0.1.0"
edition = "2021"
authors = ["Dragonborn <dovahkiin@skyrim.tamriel>"]
description = "High performance Skyrim Quest and Constellation Perks calculation engine in Rust compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
